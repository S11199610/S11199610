<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 600"
     width="100%"
     height="100%">

  <defs>

    <!-- Sphere shading -->
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7cc4ff"/>
      <stop offset="45%" stop-color="#2a84ff"/>
      <stop offset="80%" stop-color="#0a3c8a"/>
      <stop offset="100%" stop-color="#031638"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Elliptical orbit -->
    <path id="orbitPath"
          d="M 20,300
             A 280,120 0 1 1 580,300
             A 280,120 0 1 1 20,300"
          fill="none"/>

    <!-- Mask hides text behind sphere -->
    <mask id="behindSphereMask">
      <rect width="600" height="600" fill="white"/>

      <!-- Hidden area behind sphere -->
      <ellipse
        cx="300"
        cy="300"
        rx="150"
        ry="115"
        fill="black"/>
    </mask>

    <!-- Highlight -->
    <radialGradient id="highlight">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#070b18"/>

  <!-- Back orbiting text -->
  <g mask="url(#behindSphereMask)">
    <text
      fill="#ffffff"
      font-size="20"
      font-family="Segoe UI, Arial, sans-serif"
      font-weight="700"
      letter-spacing="4">

      <textPath href="#orbitPath" startOffset="0%">
        ORBITING THE SPHERE • FUTURE TECHNOLOGY • SPACE EXPLORATION • ARTIFICIAL INTELLIGENCE •

        <animate
          attributeName="startOffset"
          from="0%"
          to="100%"
          dur="12s"
          repeatCount="indefinite"/>
      </textPath>
    </text>
  </g>

  <!-- Sphere -->
  <circle
    cx="300"
    cy="300"
    r="140"
    fill="url(#sphereGrad)"
    filter="url(#glow)"/>

  <!-- Sphere highlight -->
  <circle
    cx="255"
    cy="250"
    r="60"
    fill="url(#highlight)"/>

  <!-- Front text -->
  <g>
    <text
      fill="#ffffff"
      font-size="20"
      font-family="Segoe UI, Arial, sans-serif"
      font-weight="700"
      letter-spacing="4">

      <textPath href="#orbitPath" startOffset="50%">
        ORBITING THE SPHERE • FUTURE TECHNOLOGY • SPACE EXPLORATION • ARTIFICIAL INTELLIGENCE •

        <animate
          attributeName="startOffset"
          from="50%"
          to="150%"
          dur="12s"
          repeatCount="indefinite"/>
      </textPath>
    </text>
  </g>

</svg>