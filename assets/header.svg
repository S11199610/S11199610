<svg width="400" height="400" viewBox="-200 -200 400 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="sphereGlow">
      <stop offset="0%" stop-color="#8280ff"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </radialGradient>

    <path id="textOrbit"
      d="M -170 0 A 170 52 0 1 1 170 0 A 170 52 0 1 1 -170 0"
      pathLength="100"/>

  </defs>

  <!-- Scrolling text behind the globe -->
<text fill="#ffd54d"
      fill-opacity="0.55"
      font-family="sans-serif"
      font-size="25"
      font-weight="bold"
      letter-spacing="4">
  <textPath href="#textOrbit" startOffset="0%">
    VERGIL
    <animate attributeName="startOffset"
             from="0%"
             to="100%"
             dur="8s"
             repeatCount="indefinite"/>
  </textPath>
</text>

  <!-- Sphere outline -->
  <circle cx="0" cy="0" r="120"
          fill="url(#sphereGlow)"
          fill-opacity="0.15"
          stroke="#ffd54d"
          stroke-width="2"/>

  <!-- Rotating grid -->
  <g stroke="#ffac4d" stroke-width="1.2" fill="none">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360" 
      dur="11s"
      repeatCount="indefinite"/>

    <!-- Longitude lines -->
    <ellipse rx="120" ry="30"/>
    <ellipse rx="120" ry="60"/>
    <ellipse rx="120" ry="90"/>

    <!-- Latitude lines -->
    <ellipse rx="30" ry="120"/>
    <ellipse rx="60" ry="120"/>
    <ellipse rx="90" ry="120"/>

  </g>

<!-- Orbit rings -->
<g fill="none" stroke="#ffd54d" stroke-width="2" stroke-opacity="0.55">
  <ellipse cx="0" cy="0" rx="165" ry="48" transform="rotate(-25)"/>
  <ellipse cx="0" cy="0" rx="178" ry="58" transform="rotate(25)"/>
</g>

</svg>