<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0b1d3a" />
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a2a6c" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="20"/>

  <!-- Outer Glow / Sphere Base -->
  <circle cx="200" cy="200" r="140" fill="url(#sphereGrad)" opacity="0.15" />

  <!-- Hexagonal Grid Group (Clipped to Sphere) -->
  <clipPath id="sphereClip">
    <circle cx="200" cy="200" r="135" />
  </clipPath>

  <g clip-path="url(#sphereClip)" stroke="#00f2fe" stroke-width="1.2" fill="none" opacity="0.85">
    <!-- Center Hexagon -->
    <polygon points="200,165 230,182.5 230,217.5 200,235 170,217.5 170,182.5" fill="#4facfe" fill-opacity="0.25"/>

    <!-- Ring 1 Hexagons -->
    <polygon points="200,95 230,112.5 230,147.5 200,165 170,147.5 170,112.5" fill="#00f2fe" fill-opacity="0.15"/>
    <polygon points="260,130 290,147.5 290,182.5 260,200 230,182.5 230,147.5" fill="#4facfe" fill-opacity="0.2"/>
    <polygon points="260,200 290,217.5 290,252.5 260,270 230,252.5 230,217.5" fill="#00f2fe" fill-opacity="0.15"/>
    <polygon points="200,235 230,252.5 230,287.5 200,305 170,287.5 170,252.5" fill="#4facfe" fill-opacity="0.2"/>
    <polygon points="140,200 170,217.5 170,252.5 140,270 110,252.5 110,217.5" fill="#00f2fe" fill-opacity="0.15"/>
    <polygon points="140,130 170,147.5 170,182.5 140,200 110,182.5 110,147.5" fill="#4facfe" fill-opacity="0.2"/>

    <!-- Ring 2 Hexagons (Perspective/Projected) -->
    <polygon points="200,25 225,40 225,75 200,90 175,75 175,40" stroke-opacity="0.5"/>
    <polygon points="260,60 285,75 285,110 260,125 235,110 235,75" stroke-opacity="0.5"/>
    <polygon points="320,130 345,145 345,180 320,195 295,180 295,145" stroke-opacity="0.4"/>
    <polygon points="320,205 345,220 345,255 320,270 295,255 295,220" stroke-opacity="0.4"/>
    <polygon points="260,275 285,290 285,325 260,340 235,325 235,290" stroke-opacity="0.5"/>
    <polygon points="200,310 225,325 225,360 200,375 175,360 175,325" stroke-opacity="0.5"/>
    <polygon points="140,275 165,290 165,325 140,340 115,325 115,290" stroke-opacity="0.5"/>
    <polygon points="80,205 105,220 105,255 80,270 55,255 55,220" stroke-opacity="0.4"/>
    <polygon points="80,130 105,145 105,180 80,195 55,180 55,145" stroke-opacity="0.4"/>
    <polygon points="140,60 165,75 165,110 140,125 115,110 115,75" stroke-opacity="0.5"/>

    <!-- Interstitial / Connecting Lines to enhance sphere curvature -->
    <path d="M 200,65 L 200,95 M 260,100 L 230,112.5 M 320,165 L 290,182.5 M 260,240 L 230,252.5 M 200,305 L 200,335 M 140,240 L 170,252.5 M 80,165 L 110,182.5 M 140,100 L 170,112.5" stroke="#ffffff" stroke-width="0.7" opacity="0.5"/>
  </g>

  <!-- Sphere Rim Outline & Highlight -->
  <circle cx="200" cy="200" r="135" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <circle cx="160" cy="160" r="100" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />
</svg>
